<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"><title>逐笔写字</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff7e3;color:#4a3b33;font-family:ui-rounded,-apple-system,sans-serif}body{display:flex;flex-direction:column;padding:8px 16px 16px;gap:10px}#stage{flex:1;min-height:80px;display:flex;align-items:center;justify-content:center}#square{position:relative;background:#fffdf5;border:3px solid #97795e;border-radius:20px;box-shadow:2px 4px 0 #dec9a8;overflow:hidden}#grid,#target{position:absolute;inset:0}#grid{width:100%;height:100%}#status{text-align:center;min-height:24px;font-size:16px}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:2px solid #786248;border-radius:16px;background:#ffe1a0;color:#4a3b33;box-shadow:0 3px 0 #debc80;padding:13px 16px;font:600 16px -apple-system,sans-serif;min-height:46px}button.primary{background:#d1e6cc;color:#254c37}button:nth-child(2){background:#f4d7db}button:nth-child(3){background:#d4e9f1}button:nth-child(4){background:#ffe5c6}button:disabled{opacity:.4}.speed{display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px}input{width:140px;accent-color:#245f49}#fallback{font-size:min(65vw,55vh);color:#777;display:none;text-align:center}button:focus-visible{outline:3px solid #deac4e}
</style></head><body>
<div id="stage"><div id="square"><svg id="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100" stroke="#d8bca0" stroke-width=".4" stroke-dasharray="2 2" fill="none"/></svg><div id="target" role="img" aria-label="汉字笔顺演示"></div><div id="fallback"></div></div></div>
<div id="status" role="status" aria-live="polite">正在准备笔顺…</div>
<div class="buttons"><button id="play" class="primary">重写一遍</button><button id="pause">暂停</button><button id="step">下一笔</button><button id="outline">隐藏底字</button></div>
<div class="speed"><label for="speed">慢慢写</label><input id="speed" type="range" min="0.25" max="1.5" value="0.65" step="0.05" aria-label="书写速度"><span>快一点</span></div>
<script src="hanzi-writer.min.js"></script><script src="writer.js"></script></body></html>

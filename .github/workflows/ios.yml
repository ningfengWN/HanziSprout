name: iOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned offline stroke data
        run: sh scripts/prepare_data.sh
      - name: Validate offline stroke data
        run: python3 scripts/check_data.py
      - name: Test question parsing
        run: |
          cat HanziSprout/Question.swift scripts/question_checks.swift > /tmp/question_checks.swift
          swift /tmp/question_checks.swift
      - name: Test pinyin tone normalization
        run: |
          cat HanziSprout/PinyinVoice.swift scripts/pinyin_checks.swift > /tmp/pinyin_checks.swift
          swift /tmp/pinyin_checks.swift
      - name: Test offline English lookup and correction boundaries
        run: |
          cat HanziSprout/EnglishCatalog.swift scripts/english_checks.swift > /tmp/english_checks.swift
          swift /tmp/english_checks.swift HanziSprout/LearningAssets
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -project HanziSprout.xcodeproj -scheme HanziSprout -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check built bundle identity and resources
        run: python3 scripts/check_bundle.py build/Build/Products/Debug-iphonesimulator/HanziSprout.app
      - name: Install and launch on iPhone and iPad simulators
        timeout-minutes: 10
        run: python3 scripts/check_simulators.py build/Build/Products/Debug-iphonesimulator/HanziSprout.app
      - uses: actions/upload-artifact@v4
        with:
          name: HanziSprout-Simulator
          path: build/Build/Products/Debug-iphonesimulator/HanziSprout.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-home-previews
          path: Home-*.png
  writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/prepare_data.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/hanzi-test playwright@1.58.2
      - run: /tmp/hanzi-test/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/hanzi-test/node_modules node scripts/check_writer.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Writing-screen-previews
          path: hanzi-*.png
